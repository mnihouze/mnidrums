<div class="file-grid" *ngIf="items.length; else emptyState">
  <article class="file-card card" *ngFor="let item of items">

    <div class="thumb">
      <iframe 
          *ngIf="item.linkUrl && item.embedded"
          class="embedded-iframe"
          [src]="item.linkUrl | safeUrl"
          title="{{ item.title }}" 
          width="560" 
          height="315" 
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

      <img
        *ngIf="hasWorkingImage(item)"
        [src]="item.imagePath"
        [alt]="item.title"
        (error)="onImageError(item.imagePath!)"
      />
      <div class="thumb-fallback" *ngIf="!hasWorkingImage(item)">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect x="10" y="6" width="44" height="52" rx="4" fill="#f5ead2" stroke="#96702f" stroke-width="2"/>
          <line x1="18" y1="20" x2="46" y2="20" stroke="#c9974a" stroke-width="2"/>
          <line x1="18" y1="28" x2="46" y2="28" stroke="#c9974a" stroke-width="2"/>
          <line x1="18" y1="36" x2="38" y2="36" stroke="#c9974a" stroke-width="2"/>
        </svg>
      </div>
    </div>

    <div class="file-body">
      <h3>{{ item.title }}</h3>
      <p *ngIf="item.description">{{ item.description }}</p>

      <div class="file-actions">
        <a *ngIf="item.pdfPath && !item.embedded" class="brass-btn small" [href]="item.pdfPath" target="_blank" rel="noopener">
          📄 View PDF
        </a>
        <a *ngIf="item.linkUrl && !item.embedded" class="link-btn" [href]="item.linkUrl" target="_blank" rel="noopener">
          🔗 {{ item.linkLabel || 'Open link' }}
        </a>
      </div>
    </div>
  </article>
</div>

<ng-template #emptyState>
  <p class="empty-msg">{{ emptyMessage }}</p>
</ng-template>
