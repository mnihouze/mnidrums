<header class="drum-header">
  <div class="header-inner">
    <a class="brand" routerLink="/metronome">
      <svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true">
        <ellipse cx="32" cy="14" rx="22" ry="8" fill="#e8d3ab" stroke="#96702f" stroke-width="2"/>
        <rect x="10" y="14" width="44" height="30" fill="#7a4e30" stroke="#3b2418" stroke-width="2"/>
        <ellipse cx="32" cy="44" rx="22" ry="8" fill="#5c3a24" stroke="#3b2418" stroke-width="2"/>
        <ellipse cx="32" cy="14" rx="22" ry="8" fill="none" stroke="#c9974a" stroke-width="2.5"/>
        <g stroke="#c9974a" stroke-width="2">
          <line x1="12" y1="16" x2="12" y2="42"/>
          <line x1="52" y1="16" x2="52" y2="42"/>
          <line x1="22" y1="21" x2="22" y2="47"/>
          <line x1="42" y1="21" x2="42" y2="47"/>
          <line x1="32" y1="22" x2="32" y2="48"/>
        </g>
      </svg>
      <span class="brand-text">MniDrums</span>
    </a>

    <button class="menu-toggle" (click)="menuOpen = !menuOpen" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>

    <nav class="main-nav" [class.open]="menuOpen">
      <a *ngFor="let item of navItems"
         [routerLink]="item.path"
         routerLinkActive="active"
         (click)="menuOpen = false"
         class="nav-link">
        {{ item.label }}
      </a>
    </nav>
  </div>
</header>
