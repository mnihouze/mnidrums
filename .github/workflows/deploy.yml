name: Deploy 

on:
  push:
    branches:
      - main
  # Permite rodar o deploy manualmente pela aba Actions ("Run workflow").
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm ci

      # Não publica se algum teste falhar.
      - name: Rodar os testes
        run: npm test

      # O "--" repassa a flag para o "ng build" (sem ele o npm a engole).
      # public/.htaccess (rotas do app + cache) vai junto para o browser/.
      - name: Fazer o Build
        run: npm run build -- --configuration production

      - name: Enviar arquivos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/mnidrums-site/browser/
          server-dir: ./
