name: Deploy

on:
  # Testes rodam em qualquer branch e em PRs; o deploy só acontece na main.
  push:
  pull_request:
  # Permite rodar manualmente pela aba Actions ("Run workflow").
  workflow_dispatch:

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

  web-deploy:
    name: Build and Deploy
    needs: test
    # Só publica a partir da main (push ou execução manual), nunca em PRs.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O "--" repassa a flag para o "ng build" (sem ele o npm a engole).
      # public/.htaccess (rotas do app + cache) vai junto para o browser/.
      - name: Fazer o Build
        run: npm run build -- --configuration production

      - name: Enviar arquivos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/mnidrums-site/browser/
          server-dir: ./
